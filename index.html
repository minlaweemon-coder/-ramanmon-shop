
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<ramanmonshop>RAMANMON SHOP</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Myanmar Text",sans-serif;
  background:#f5f6f8;
  color:#222
}
header{
  background:#111;
  color:white;
  padding:18px 20px;
  position:sticky;
  top:0;
  z-index:10
}
.top{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}
.logo{
  font-size:25px;
  font-weight:bold
}
.logo span{color:#55d66b}
.cart{
  background:#55d66b;
  color:#111;
  border:0;
  padding:12px 18px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer
}
.hero{
  background:linear-gradient(135deg,#111,#333);
  color:white;
  padding:45px 20px
}
.heroIn{
  max-width:1100px;
  margin:auto
}
.hero h1{
  font-size:38px;
  margin:0 0 10px
}
.hero p{
  color:#ddd;
  font-size:17px
}
.wrap{
  max-width:1100px;
  margin:auto;
  padding:25px 20px
}
.search{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:20px
}
.cats{
  display:flex;
  gap:10px;
  overflow:auto;
  margin-bottom:25px
}
.cat{
  border:0;
  background:white;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap
}
.cat.active{
  background:#111;
  color:white
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px
}
.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 15px #00000012
}
.pic{
  height:190px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999;
  overflow:hidden
}
.pic img{
  width:100%;
  height:100%;
  object-fit:cover
}
.info{
  padding:15px
}
.name{
  font-size:17px;
  font-weight:bold;
  min-height:42px
}
.price{
  color:#e53935;
  font-size:20px;
  font-weight:bold;
  margin:10px 0
}
.stock{
  color:#777;
  font-size:13px
}
.buy{
  width:100%;
  border:0;
  background:#111;
  color:white;
  padding:12px;
  border-radius:9px;
  cursor:pointer;
  margin-top:10px;
  font-weight:bold
}
.buy:hover{background:#55d66b;color:#111}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:20;
  padding:20px
}
.modalBox{
  background:white;
  max-width:500px;
  margin:50px auto;
  border-radius:18px;
  padding:22px;
  max-height:85vh;
  overflow:auto
}
.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px;
  cursor:pointer
}
.item{
  border-bottom:1px solid #ddd;
  padding:12px 0
}
.total{
  font-size:22px;
  font-weight:bold;
  margin:20px 0
}
.form input,.form textarea{
  width:100%;
  padding:13px;
  margin:6px 0;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px
}
.order{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#55d66b;
  font-weight:bold;
  cursor:pointer
}
.empty{
  text-align:center;
  padding:30px;
  color:#888
}
footer{
  background:#111;
  color:#aaa;
  text-align:center;
  padding:30px;
  margin-top:40px
}
@media(max-width:850px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:500px){
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .pic{height:145px}
  .hero h1{font-size:28px}
  .wrap{padding:18px 10px}
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">RAMANMON <span>SHOP</span></div>
    <button class="cart" onclick="openCart()">
      🛒 Cart <span id="cartCount">0</span>
    </button>
  </div>
</header>

<section class="hero">
  <div class="heroIn">
    <h1>RAMANMON SHOP</h1>
    <p>ဆိုင်ကယ်ပစ္စည်းများကို လွယ်ကူစွာ ဝယ်ယူနိုင်ပါပြီ</p>
  </div>
</section>

<main class="wrap">

<input
  id="search"
  class="search"
  type="text"
  placeholder="🔍 ပစ္စည်းရှာရန်..."
  oninput="renderProducts()"
>

<div class="cats">
  <button class="cat active" onclick="setCat('အားလုံး',this)">အားလုံး</button>
  <button class="cat" onclick="setCat('Shock',this)">Shock</button>
  <button class="cat" onclick="setCat('ထိုင်ခုံ',this)">ထိုင်ခုံ</button>
  <button class="cat" onclick="setCat('Radiator',this)">Radiator</button>
  <button class="cat" onclick="setCat('အင်ဂျင်',this)">အင်ဂျင်</button>
</div>

<div id="products" class="grid"></div>

</main>

<footer>
  <div>© 2026 RAMANMON SHOP</div>
  <div>Quality Motorcycle Parts</div>
</footer>

<!-- CART -->
<div id="cartModal" class="modal">
  <div class="modalBox">

    <button class="close" onclick="closeCart()">✕</button>

    <h2>🛒 ဝယ်ယူမည့်ပစ္စည်းများ</h2>

    <div id="cartItems"></div>

    <div class="total">
      စုစုပေါင်း — <span id="total">0</span> Ks
    </div>

    <div class="form">
      <input id="customer" placeholder="အမည်">
      <input id="phone" placeholder="ဖုန်းနံပါတ်">
      <textarea id="address" rows="3" placeholder="ပို့ဆောင်ရမည့်လိပ်စာ"></textarea>
    </div>

    <button class="order" onclick="placeOrder()">
      📦 Order တင်မယ်
    </button>

  </div>
</div>

<script>

const products = [

{
 id:1,
 name:"KON အင်ဂျင်",
 category:"အင်ဂျင်",
 price:700000,
 stock:10,
 image:""
},

{
 id:2,
 name:"RAMANMON Rear Shock",
 category:"Shock",
 price:180000,
 stock:10,
 image:""
},

{
 id:3,
 name:"ဆိုင်ကယ်ထိုင်ခုံ",
 category:"ထိုင်ခုံ",
 price:270000,
 stock:10,
 image:""
},

{
 id:4,
 name:"BRD ရေတိုင်ကီ",
 category:"Radiator",
 price:430000,
 stock:10,
 image:""
}

];

let currentCat="အားလုံး";
let cart=[];

function money(n){
 return Number(n).toLocaleString("en-US");
}

function setCat(cat,btn){
 currentCat=cat;

 document.querySelectorAll(".cat")
 .forEach(x=>x.classList.remove("active"));

 btn.classList.add("active");

 renderProducts();
}

function renderProducts(){

 const box=document.getElementById("products");

 const search=document
 .getElementById("search")
 .value
 .toLowerCase();

 let list=products.filter(p=>{

   const catOK=
     currentCat==="အားလုံး" ||
     p.category===currentCat;

   const searchOK=
     p.name.toLowerCase().includes(search);

   return catOK && searchOK;
 });

 if(list.length===0){
   box.innerHTML='<div class="empty">ပစ္စည်းမတွေ့ပါ</div>';
   return;
 }

 box.innerHTML=list.map(p=>`

   <div class="card">

     <div class="pic">
       ${
         p.image
         ? `<img src="${p.image}" alt="${p.name}">`
         : `📦`
       }
     </div>

     <div class="info">

       <div class="name">${p.name}</div>

       <div class="price">
         ${money(p.price)} Ks
       </div>

       <div class="stock">
         လက်ကျန် ${p.stock}
       </div>

       <button class="buy" onclick="addCart(${p.id})">
         🛒 Cart ထဲထည့်
       </button>

     </div>

   </div>

 `).join("");
}

function addCart(id){

 const product=products.find(p=>p.id===id);

 const found=cart.find(p=>p.id===id);

 if(found){
   found.qty++;
 }else{
   cart.push({
     ...product,
     qty:1
   });
 }

 updateCart();

 alert(product.name+" ကို Cart ထဲထည့်ပြီးပါပြီ");
}

function updateCart(){

 document.getElementById("cartCount").textContent=
 cart.reduce((sum,p)=>sum+p.qty,0);

 const box=document.getElementById("cartItems");

 if(cart.length===0){
   box.innerHTML='<div class="empty">Cart ထဲမှာ ပစ္စည်းမရှိသေးပါ</div>';
   document.getElementById("total").textContent="0";
   return;
 }

 let total=0;

 box.innerHTML=cart.map(p=>{

   total+=p.price*p.qty;

   return `
   <div class="item">

     <b>${p.name}</b>

     <div>
       ${money(p.price)} Ks × ${p.qty}
     </div>

     <button onclick="removeCart(${p.id})">
       ဖယ်မယ်
     </button>

   </div>
   `;

 }).join("");

 document.getElementById("total").textContent=
 money(total);
}

function removeCart(id){

 cart=cart.filter(p=>p.id!==id);

 updateCart();
}

function openCart(){

 updateCart();

 document.getElementById("cartModal").style.display="block";
}

function closeCart(){

 document.getElementById("cartModal").style.display="none";
}

function placeOrder(){

 if(cart.length===0){
   alert("ပစ္စည်းအရင်ရွေးပါ");
   return;
 }

 const name=document.getElementById("customer").value;
 const phone=document.getElementById("phone").value;
 const address=document.getElementById("address").value;

 if(!name || !phone || !address){

   alert("အမည်၊ ဖုန်းနံပါတ်၊ လိပ်စာ ဖြည့်ပေးပါ");

   return;
 }

 let text="RAMANMON SHOP ORDER%0A%0A";

 cart.forEach(p=>{

   text+=
   p.name+
   " × "+
   p.qty+
   " = "+
   money(p.price*p.qty)+
   " Ks%0A";

 });

 const total=cart.reduce(
   (sum,p)=>sum+p.price*p.qty,
   0
 );

 text+="%0Aစုစုပေါင်း: "+
 money(total)+
 " Ks%0A%0A";

 text+="အမည်: "+encodeURIComponent(name)+"%0A";
 text+="ဖုန်း: "+encodeURIComponent(phone)+"%0A";
 text+="လိပ်စာ: "+encodeURIComponent(address);

 /*
   ဒီနေရာမှာ ဆိုင်ရဲ့ Telegram / Messenger
   / WhatsApp link ထည့်နိုင်ပါတယ်။
 */

 alert(
   "Order အချက်အလက် ပြင်ဆင်ပြီးပါပြီ။\\n\\n"+
   "စုစုပေါင်း "+money(total)+" Ks"
 );

}

renderProducts();

</script>

</body>
</html>
